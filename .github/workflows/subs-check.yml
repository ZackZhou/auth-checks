name: Run subs-check

on:
  schedule:
    # 每 8 小时运行一次（UTC 0:00, 8:00, 16:00；对应中国时间 8:00, 16:00, 次日 0:00）
    - cron: '0 */8 * * *'
    # 每小时醒一次但只在整点小时（UTC 0/8/16）真正检测：
    # 这样你随时手动改配置或重新触发，最迟 1 小时内就会自动更新，
    # 其余整点直接快速结束，不会白跑 30 分钟的检测。
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      skip_check:
        description: '跳过 subs-check 检测，只重新发布 Pages（用于测试 Pages 是否可用）'
        type: boolean
        default: false

# 发布到 GitHub Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支只保留最新一次运行，避免旧运行覆盖新结果
concurrency:
  group: subs-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-subscriptions:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 决定本次是否检测
        id: decide
        run: |
          # 两种情况跳过检测：手动勾了 skip_check，或每小时唤醒但不在 0/8/16 点
          SKIP="${{ inputs.skip_check }}"
          HOUR="$(date -u +%H)"
          if [ "$SKIP" = "true" ]; then
            echo "skip=true reason=manual (skip_check)"
          elif [ "$HOUR" != "00" ] && [ "$HOUR" != "08" ] && [ "$HOUR" != "16" ]; then
            echo "skip=true reason=off-hour ($HOUR UTC, 只在 0/8/16 点检测)"
          else
            echo "skip=false (整点检测)"
          fi | tee -a "$GITHUB_OUTPUT"

      - name: 准备配置文件和输出目录
        run: |
          cp config.example.yaml config.yaml
          mkdir -p output
          # 先写一个空的 all.yaml：这样即使 subs-check 被跳过或提前退出，
          # output/ 里也有一个非隐藏文件，产物一定能上传成功
          printf 'proxies: []\n' > output/all.yaml
          ls -la output

      - name: 运行 subs-check (Docker)
        if: ${{ steps.decide.outputs.skip != 'true' }}
        run: |
          # 后台启动容器，指定运行用户，避免产物权限问题
          docker run -d --name subs-check \
            --user $(id -u):$(id -g) \
            -e TZ=Asia/Shanghai \
            -e CHECK_INTERVAL=99999999 \
            -v ${{ github.workspace }}/config.yaml:/app/config/config.yaml \
            -v ${{ github.workspace }}/output:/app/output \
            ghcr.io/beck-8/subs-check:latest

          echo "🚀 容器已启动，开始轮询日志..."
          TIMEOUT=1800   # 最多等待 30 分钟
          ELAPSED=0
          FOUND=false

          while [ $ELAPSED -lt $TIMEOUT ]; do
            REMAINING=$((TIMEOUT - ELAPSED))
            echo "⏳ 已等待 ${ELAPSED}s / 剩余 ${REMAINING}s（每 10s 检查一次）"

            if docker logs subs-check 2>&1 | grep -q "下次检查时间"; then
              FOUND=true
              echo "✅ 检测到'下次检查时间'，检查已完成"
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' subs-check 2>/dev/null)" != "true" ]; then
              echo "⚠️ 容器已自行退出，停止等待"
              break
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          if [ "$FOUND" = "true" ]; then
            echo "🎯 原因：日志中出现了'下次检查时间'"
          elif [ $ELAPSED -ge $TIMEOUT ]; then
            echo "⌛ 原因：达到最大等待时间 ${TIMEOUT}s"
          else
            echo "🛑 原因：容器提前退出"
          fi

          echo "=== subs-check 容器日志 ==="
          docker logs subs-check 2>&1 || true

          docker kill subs-check 2>/dev/null || true
          docker rm subs-check 2>/dev/null || true
          echo "🧹 容器已清理，进入下一步"

      - name: 列出检测结果
        run: |
          echo "output/ 内容："
          ls -la output || true
          test -f output/all.yaml || { echo "缺少 output/all.yaml"; exit 1; }
          echo "all.yaml 节点数：$(grep -c '^  - name:' output/all.yaml || true)"

      - name: 上传检测结果
        uses: actions/upload-artifact@v4
        with:
          name: subs-check-results
          path: output/
          # 出错就报错，而不是静默产出一个空产物
          if-no-files-found: error

  # 过滤 all.yaml，只保留包含 client-fingerprint 的节点，并重新生成 base64.txt
  filter-all-yaml:
    needs: check-subscriptions
    runs-on: ubuntu-latest
    steps:
      - name: 下载检测结果
        uses: actions/download-artifact@v4
        with:
          name: subs-check-results
          path: output

      - name: 安装 PyYAML
        run: python3 -m pip install pyyaml

      - name: 过滤 all.yaml 并重新生成 base64.txt
        run: |
          python3 - <<'PYEOF'
          import base64
          import json
          import urllib.parse
          from pathlib import Path

          import yaml

          OUTPUT_DIR = Path('output')
          INPUT_FILE = OUTPUT_DIR / 'all.yaml'
          OUTPUT_YAML = OUTPUT_DIR / 'all.yaml'
          OUTPUT_BASE64 = OUTPUT_DIR / 'base64.txt'

          def b64(s: str) -> str:
              return base64.b64encode(s.encode()).decode()

          def to_link(node: dict):
              t = node.get('type')
              name = node.get('name', '')
              server = node.get('server', '')
              port = node.get('port', '')
              frag = '#' + urllib.parse.quote(name, safe='')

              if t == 'vless':
                  params = {
                      'encryption': 'none',
                      'security': 'tls' if node.get('tls') else 'none',
                  }
                  if node.get('servername'):
                      params['sni'] = node['servername']
                  if node.get('client-fingerprint'):
                      params['fp'] = node['client-fingerprint']
                  if node.get('flow'):
                      params['flow'] = node['flow']

                  network = node.get('network', 'tcp')
                  params['type'] = network

                  if network == 'ws':
                      ws = node.get('ws-opts', {}) or {}
                      if ws.get('path'):
                          params['path'] = ws['path']
                      host = (ws.get('headers') or {}).get('Host')
                      if host:
                          params['host'] = host
                  elif network == 'grpc':
                      grpc = node.get('grpc-opts', {}) or {}
                      if grpc.get('grpc-service-name'):
                          params['serviceName'] = grpc['grpc-service-name']
                  elif network == 'xhttp':
                      x = node.get('xhttp-opts', {}) or {}
                      if x.get('path'):
                          params['path'] = x['path']
                      if x.get('host'):
                          params['host'] = x['host']
                      if x.get('mode'):
                          params['mode'] = x['mode']

                  # Reality 参数
                  reality = node.get('reality-opts', {}) or {}
                  if reality.get('public-key'):
                      params['pbk'] = reality['public-key']
                      params['security'] = 'reality'
                  if reality.get('short-id'):
                      params['sid'] = reality['short-id']

                  query = urllib.parse.urlencode(params)
                  return f"vless://{node.get('uuid','')}@{server}:{port}?{query}{frag}"

              if t == 'vmess':
                  net = node.get('network', 'tcp')
                  params = {
                      'v': '2',
                      'ps': name,
                      'add': server,
                      'port': str(port),
                      'id': node.get('uuid', ''),
                      'aid': str(node.get('alterId', 0)),
                      'scy': node.get('cipher', 'auto'),
                      'net': net,
                      'type': 'none',
                      'host': '',
                      'path': '',
                      'tls': 'tls' if node.get('tls') else '',
                      'sni': node.get('servername', ''),
                  }
                  if net == 'ws':
                      ws = node.get('ws-opts', {}) or {}
                      params['path'] = ws.get('path', '')
                      params['host'] = (ws.get('headers') or {}).get('Host', '')
                  return 'vmess://' + b64(json.dumps(params, ensure_ascii=False))

              if t == 'trojan':
                  params = {'security': 'tls'}
                  if node.get('sni'):
                      params['sni'] = node['sni']
                  if node.get('client-fingerprint'):
                      params['fp'] = node['client-fingerprint']

                  network = node.get('network', 'tcp')
                  params['type'] = network
                  if network == 'ws':
                      ws = node.get('ws-opts', {}) or {}
                      if ws.get('path'):
                          params['path'] = ws['path']
                      host = (ws.get('headers') or {}).get('Host')
                      if host:
                          params['host'] = host
                  query = urllib.parse.urlencode(params)
                  return f"trojan://{node.get('password','')}@{server}:{port}?{query}{frag}"

              if t == 'ss':
                  cipher = node.get('cipher', '')
                  password = node.get('password', '')
                  userinfo = b64(f"{cipher}:{password}")
                  return f"ss://{userinfo}@{server}:{port}{frag}"

              return None

          def main():
              OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

              if not INPUT_FILE.exists():
                  # 检测步骤没产出 all.yaml（提前退出，或手动跳过了检测）
                  OUTPUT_BASE64.write_text(
                      '# no results: output/all.yaml was not produced by this run\n',
                      encoding='utf-8',
                  )
                  print('未找到 output/all.yaml，已写入占位 base64.txt')
                  return

              if INPUT_FILE.stat().st_size == 0:
                  OUTPUT_BASE64.write_text(
                      '# no results: output/all.yaml is empty\n',
                      encoding='utf-8',
                  )
                  print('output/all.yaml 是空文件，已写入占位 base64.txt')
                  return

              with INPUT_FILE.open('r', encoding='utf-8') as f:
                  data = yaml.safe_load(f)

              if not isinstance(data, dict):
                  OUTPUT_BASE64.write_text(
                      '# no results: output/all.yaml is not a mapping\n',
                      encoding='utf-8',
                  )
                  print('output/all.yaml 内容不是字典结构，已写入占位 base64.txt')
                  return

              proxies = data.get('proxies', [])
              if not isinstance(proxies, list):
                  raise SystemExit('错误：all.yaml 中未找到 proxies 列表')

              # 过滤：只保留包含 client-fingerprint 且值非空的节点
              filtered = [
                  p for p in proxies
                  if isinstance(p, dict)
                  and 'client-fingerprint' in p
                  and p['client-fingerprint']
              ]

              data['proxies'] = filtered

              with OUTPUT_YAML.open('w', encoding='utf-8') as f:
                  yaml.dump(data, f, allow_unicode=True, sort_keys=False)

              # 生成 base64 订阅内容
              links = []
              for p in filtered:
                  link = to_link(p)
                  if link:
                      links.append(link)

              if not links:
                  # 过滤后没有节点：同样写占位文件，而不是让整条流水线失败
                  OUTPUT_BASE64.write_text(
                      '# no nodes left after filtering\n',
                      encoding='utf-8',
                  )
                  print('过滤后没有可用节点，已写入占位 base64.txt')
                  return

              text = '\n'.join(links)
              result = base64.b64encode(text.encode()).decode()

              # 末尾补一个换行：既是多数订阅格式的习惯，也让 `wc -l` 能数对节点数
              with OUTPUT_BASE64.open('w', encoding='utf-8') as f:
                  f.write(result + '\n')

              print(f'原始节点数：{len(proxies)}，过滤后：{len(filtered)}，生成分享链接：{len(links)}')

          if __name__ == '__main__':
              main()
          PYEOF

      - name: 上传过滤后的结果
        uses: actions/upload-artifact@v4
        with:
          name: subs-check-filtered
          path: output/

  send-email:
    needs: filter-all-yaml
    runs-on: ubuntu-latest
    steps:
      - name: 下载过滤后的结果
        uses: actions/download-artifact@v4
        with:
          name: subs-check-filtered
          path: output

      - name: 发送邮件
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: subs-check 检测结果 - ${{ github.run_id }}
          # 两个收件人，用英文逗号分隔
          to: ${{ secrets.MAIL_TO_1 }}, ${{ secrets.MAIL_TO_2 }}
          from: 'subs-check <${{ secrets.MAIL_USERNAME }}>'
          # 邮件正文直接使用 base64.txt 的内容
          body: file://output/base64.txt
          # 同时作为附件发送：base64.txt 和过滤后的 all.yaml
          attachments: output/base64.txt,output/all.yaml

  # 把 base64.txt 发布到 GitHub Pages，得到一个固定 URL 直接访问
  publish-pages:
    needs: filter-all-yaml
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载过滤后的结果
        uses: actions/download-artifact@v4
        with:
          name: subs-check-filtered
          path: output

      - name: 准备 Pages 站点目录
        run: |
          mkdir -p public
          cp output/base64.txt public/base64.txt

          # 附上节点数量与更新时间，方便确认站点内容是新的
          # printf 补上末尾换行，wc -l 才能把最后一个链接也数进去
          {
            echo "nodes:  $(printf '%s\n' "$(base64 -d public/base64.txt 2>/dev/null)" | grep -c .)"
            echo "run:    ${{ github.run_number }}"
            echo "time:   $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "commit: ${{ github.sha }}"
          } > public/status.txt

          # 不希望被搜索引擎收录
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          printf '<!doctype html><meta name="robots" content="noindex"><title>base64.txt</title><a href="base64.txt">base64.txt</a>\n' > public/index.html

          ls -la public
          echo "base64.txt 大小：$(wc -c < public/base64.txt) 字节"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
