name: Run subs-check

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 中国时间 08:00
  workflow_dispatch:

jobs:
  check-subscriptions:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 准备配置文件和输出目录
        run: |
          cp config.example.yaml config.yaml
          mkdir -p output

      - name: 运行 subs-check (Docker)
        run: |
          # 后台启动容器
          docker run -d --name subs-check \
            -e CHECK_INTERVAL=99999999 \
            -v ${{ github.workspace }}/config.yaml:/app/config/config.yaml \
            -v ${{ github.workspace }}/output:/app/output \
            ghcr.io/beck-8/subs-check:latest

          # 轮询日志，等待出现"下次检查时间"
          TIMEOUT=1800   # 最多等待 30 分钟
          ELAPSED=0
          FOUND=false
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if docker logs subs-check 2>&1 | grep -q "下次检查时间"; then
              FOUND=true
              break
            fi
            # 如果容器已经退出，也停止等待
            if [ "$(docker inspect -f '{{.State.Running}}' subs-check)" != "true" ]; then
              echo "容器已自行退出"
              break
            fi
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          # 打印完整日志供排查
          echo "=== subs-check 容器日志 ==="
          docker logs subs-check 2>&1 || true

          # 停止并清理容器
          if [ "$FOUND" = "true" ]; then
            echo "✅ 检测到'下次检查时间'，检查已完成，停止容器"
          else
            echo "⚠️ 未检测到'下次检查时间'（超时或容器已退出），仍然停止容器"
          fi
          docker kill subs-check 2>/dev/null || true
          docker rm subs-check 2>/dev/null || true

      - name: 上传检测结果
        uses: actions/upload-artifact@v4
        with:
          name: subs-check-results
          path: output/
