      - name: 运行 subs-check (Docker)
        run: |
          # 后台启动容器
          docker run -d --name subs-check \
            -e CHECK_INTERVAL=99999999 \
            -v ${{ github.workspace }}/config.yaml:/app/config/config.yaml \
            -v ${{ github.workspace }}/output:/app/output \
            ghcr.io/beck-8/subs-check:latest

          echo "🚀 容器已启动，开始轮询日志..."
          TIMEOUT=1800   # 最多等待 30 分钟
          ELAPSED=0
          FOUND=false

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # 进度打印
            REMAINING=$((TIMEOUT - ELAPSED))
            echo "⏳ 已等待 ${ELAPSED}s / 剩余 ${REMAINING}s（每 10s 检查一次）"

            # 检查日志关键字
            if docker logs subs-check 2>&1 | grep -q "下次检查时间"; then
              FOUND=true
              echo "✅ 检测到'下次检查时间'，检查已完成"
              break
            fi

            # 检查容器是否还在运行
            if [ "$(docker inspect -f '{{.State.Running}}' subs-check 2>/dev/null)" != "true" ]; then
              echo "⚠️ 容器已自行退出，停止等待"
              break
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          # 收尾提示
          if [ "$FOUND" = "true" ]; then
            echo "🎯 原因：日志中出现了'下次检查时间'"
          elif [ $ELAPSED -ge $TIMEOUT ]; then
            echo "⌛ 原因：达到最大等待时间 ${TIMEOUT}s"
          else
            echo "🛑 原因：容器提前退出"
          fi

          # 打印完整日志
          echo "=== subs-check 容器日志 ==="
          docker logs subs-check 2>&1 || true

          # 停止并清理容器
          docker kill subs-check 2>/dev/null || true
          docker rm subs-check 2>/dev/null || true
          echo "🧹 容器已清理，进入下一步"
